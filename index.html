<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Hub</title>
<meta name="color-scheme" content="light dark">
<style>
:root {
  --bg: #f5f5f7;
  --bg-glow-1: rgba(66,133,244,.16);
  --bg-glow-2: rgba(52,168,83,.12);
  --bg-glow-3: rgba(251,188,5,.12);
  --surface: rgba(255,255,255,.72);
  --surface-solid: #ffffff;
  --surface-hover: rgba(255,255,255,.95);
  --stroke: rgba(0,0,0,.06);
  --edge: rgba(255,255,255,.7);
  --label: #1d1d1f;
  --label-2: rgba(29,29,31,.62);
  --label-3: rgba(29,29,31,.4);
  --fill: rgba(118,118,128,.12);
  --accent: #0071e3;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --shadow-lift: 0 2px 4px rgba(0,0,0,.05), 0 16px 40px rgba(0,0,0,.10);
  --radius: 18px;
  --ease: cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --bg-glow-1: rgba(66,133,244,.22);
    --bg-glow-2: rgba(52,168,83,.14);
    --bg-glow-3: rgba(234,67,53,.12);
    --surface: rgba(44,44,46,.6);
    --surface-solid: #1c1c1e;
    --surface-hover: rgba(58,58,60,.75);
    --stroke: rgba(255,255,255,.08);
    --edge: rgba(255,255,255,.08);
    --label: #f5f5f7;
    --label-2: rgba(235,235,245,.62);
    --label-3: rgba(235,235,245,.36);
    --fill: rgba(118,118,128,.24);
    --accent: #2997ff;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --shadow-lift: 0 2px 4px rgba(0,0,0,.35), 0 18px 44px rgba(0,0,0,.5);
  }
}

* { box-sizing: border-box; margin: 0; }
html { font: 100%/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--label);
  letter-spacing: -0.01em;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(60vw 50vh at 10% -10%, var(--bg-glow-1), transparent 70%),
    radial-gradient(50vw 50vh at 100% 10%, var(--bg-glow-2), transparent 70%),
    radial-gradient(60vw 60vh at 50% 120%, var(--bg-glow-3), transparent 70%);
}

/* ---------- Toolbar (translucent material) ---------- */
.toolbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 16px;
  padding: 14px max(24px, calc((100vw - 1120px) / 2));
  background: color-mix(in srgb, var(--bg) 62%, transparent);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-mask-image: linear-gradient(#000 calc(100% - 10px), transparent);
          mask-image: linear-gradient(#000 calc(100% - 10px), transparent);
  padding-bottom: 24px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.0625rem; letter-spacing: -0.022em; white-space: nowrap; }
.brand-dot { width: 22px; height: 22px; border-radius: 7px; background: conic-gradient(#ea4335 0 25%, #fbbc05 0 50%, #34a853 0 75%, #4285f4 0); }
.search {
  flex: 1; max-width: 460px; margin-left: auto;
  position: relative;
}
.search svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; width: 15px; height: 15px; color: var(--label-3); }
.search input {
  width: 100%; height: 34px; padding: 0 56px 0 33px;
  border: 0; border-radius: 10px; outline: none;
  background: var(--fill); color: var(--label);
  font: inherit; font-size: .9375rem; letter-spacing: -0.01em;
  transition: box-shadow 160ms var(--ease), background 160ms var(--ease);
}
.search input::placeholder { color: var(--label-3); }
.search input:focus { background: var(--surface-solid); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 30%, transparent); }
.search kbd {
  position: absolute; right: 8px; top: 50%; translate: 0 -50%;
  font: 500 .75rem/1 -apple-system, system-ui; color: var(--label-3);
  padding: 4px 6px; border-radius: 6px; background: var(--fill);
}

/* ---------- Layout ---------- */
main { max-width: 1120px; margin: 0 auto; padding: 8px 24px 64px; }
.hero { padding: 24px 0 28px; }
.hero h1 {
  font-size: clamp(2rem, 4.4vw, 3rem); line-height: 1.07; font-weight: 700;
  letter-spacing: -0.028em;
}
.hero p { margin-top: 6px; color: var(--label-2); font-size: 1.0625rem; letter-spacing: -0.016em; }

section { margin-top: 36px; }
section h2 {
  font-size: 1.375rem; font-weight: 700; letter-spacing: -0.022em; line-height: 1.2;
  margin-bottom: 14px; display: flex; align-items: baseline; gap: 10px;
}
section h2 small { font-size: .8125rem; font-weight: 500; color: var(--label-3); letter-spacing: 0; }

/* ---------- Quick create ---------- */
.quick { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  height: 36px; padding: 0 14px 0 10px; border-radius: 999px;
  background: var(--surface); box-shadow: inset 0 0 0 .5px var(--stroke), var(--shadow);
  -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  color: var(--label); text-decoration: none; font-size: .875rem; font-weight: 500;
  transition: transform 220ms var(--ease), background 160ms;
  -webkit-tap-highlight-color: transparent;
}
.chip:hover { background: var(--surface-hover); }
.chip:active { transform: scale(.96); transition-duration: 90ms; }
.chip i { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; color: #fff; font-style: normal; font-size: 14px; font-weight: 700; }

/* ---------- App grid ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.app {
  position: relative;
  display: flex; flex-direction: column; align-items: flex-start; gap: 14px;
  padding: 16px; border-radius: var(--radius);
  background: var(--surface);
  -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  box-shadow: inset 0 .5px 0 var(--edge), inset 0 0 0 .5px var(--stroke), var(--shadow);
  color: var(--label); text-decoration: none;
  transition: transform 340ms var(--ease), box-shadow 340ms var(--ease), background 200ms;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}
.app:hover { transform: translateY(-2px); box-shadow: inset 0 .5px 0 var(--edge), inset 0 0 0 .5px var(--stroke), var(--shadow-lift); background: var(--surface-hover); }
.app:active { transform: scale(.97); transition-duration: 100ms; }
.app:focus-visible { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 60%, transparent), var(--shadow-lift); }
.icon {
  width: 48px; height: 48px; border-radius: 12px;
  display: grid; place-items: center; color: #fff;
  background: var(--c);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(0,0,0,.08), 0 2px 6px color-mix(in srgb, var(--c) 35%, transparent);
  background-image: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0) 60%);
}
.icon svg { width: 26px; height: 26px; }
.app .name { font-size: .9375rem; font-weight: 600; letter-spacing: -0.016em; line-height: 1.2; }
.app .desc { font-size: .8125rem; color: var(--label-2); letter-spacing: -0.006em; line-height: 1.3; margin-top: 2px; }

.pin {
  position: absolute; top: 10px; right: 10px;
  width: 28px; height: 28px; border-radius: 50%; border: 0; cursor: default;
  display: grid; place-items: center;
  background: transparent; color: var(--label-3);
  opacity: 0; transition: opacity 160ms, background 160ms, transform 160ms var(--ease);
}
.pin svg { width: 15px; height: 15px; }
.app:hover .pin, .pin:focus-visible, .pin.on { opacity: 1; }
.pin:hover { background: var(--fill); }
.pin:active { transform: scale(.88); }
.pin.on { color: #ff9f0a; }

.empty { color: var(--label-3); font-size: .9375rem; padding: 24px 0; display: none; }
.hidden { display: none !important; }

footer { margin-top: 56px; color: var(--label-3); font-size: .8125rem; text-align: center; }

/* entrance */
.app, .chip { animation: rise 520ms var(--ease) both; animation-delay: calc(var(--i, 0) * 18ms); }
@keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.985); } }

@media (prefers-reduced-motion: reduce) {
  .app, .chip { animation: fade 200ms ease both; }
  .app:hover, .app:active, .chip:active { transform: none; }
  @keyframes fade { from { opacity: 0; } }
}
@media (prefers-reduced-transparency: reduce) {
  .toolbar { background: var(--bg); backdrop-filter: none; -webkit-backdrop-filter: none; }
  .app, .chip { background: var(--surface-solid); backdrop-filter: none; -webkit-backdrop-filter: none; }
}
@media (prefers-contrast: more) {
  .app, .chip { background: var(--surface-solid); box-shadow: inset 0 0 0 1px var(--label-3); }
}
@media (max-width: 560px) {
  .toolbar { padding-inline: 16px; }
  .brand span { display: none; }
  main { padding-inline: 16px; }
  .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .search kbd { display: none; }
}
</style>
</head>
<body>

<header class="toolbar">
  <div class="brand"><div class="brand-dot" aria-hidden="true"></div><span>Google Hub</span></div>
  <label class="search">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar apps" autocomplete="off" spellcheck="false" aria-label="Buscar apps">
    <kbd>⌘K</kbd>
  </label>
</header>

<main>
  <div class="hero">
    <h1 id="greet">Olá.</h1>
    <p id="date"></p>
  </div>

  <section id="quickSec">
    <h2>Criar novo</h2>
    <div class="quick" id="quick"></div>
  </section>

  <section id="favSec">
    <h2>Favoritos <small>passe o mouse e toque na estrela para fixar</small></h2>
    <div class="grid" id="fav"></div>
  </section>

  <div id="cats"></div>
  <p class="empty" id="empty">Nenhum app encontrado.</p>

  <footer>Tudo abre em uma nova aba do Safari · ⌘K para buscar · Enter abre o primeiro resultado</footer>
</main>

  { id:'play', n:'Play Store', d:'Apps e jogos', u:'https://play.google.com/', i:'bag', c:C.teal, cat:'Mídia & Lugares' },
  // Negócios
  { id:'analytics', n:'Analytics', d:'Métricas do site', u:'https://analytics.google.com/', i:'bars', c:C.orange, cat:'Negócios & Marketing', k:'ga4' },
  { id:'searchconsole', n:'Search Console', d:'SEO', u:'https://search.google.com/search-console', i:'chart', c:'#458CF5', cat:'Negócios & Marketing', k:'seo gsc' },
  { id:'ads', n:'Google Ads', d:'Anúncios', u:'https://ads.google.com/', i:'ad', c:C.yellow, cat:'Negócios & Marketing', k:'adwords' },
  { id:'looker', n:'Looker Studio', d:'Relatórios', u:'https://lookerstudio.google.com/', i:'pie', c:'#4285F4', cat:'Negócios & Marketing', k:'data studio dashboard' },
  { id:'business', n:'Perfil da Empresa', d:'Business Profile', u:'https://business.google.com/', i:'site', c:C.blue, cat:'Negócios & Marketing', k:'meu negocio' },
  { id:'trends', n:'Trends', d:'Tendências', u:'https://trends.google.com/', i:'chart', c:'#1A73E8', cat:'Negócios & Marketing', k:'tendencias' },
  { id:'classroom', n:'Classroom', d:'Sala de aula', u:'https://classroom.google.com/', i:'school', c:'#1E8E3E', cat:'Negócios & Marketing' },
  // Conta
  { id:'account', n:'Minha Conta', d:'Configurações', u:'https://myaccount.google.com/', i:'shield', c:C.blue, cat:'Conta', k:'account senha segurança' },
  { id:'one', n:'Google One', d:'Armazenamento', u:'https://one.google.com/', i:'cloud', c:C.blue, cat:'Conta', k:'storage' },
  { id:'wallet', n:'Wallet', d:'Pagamentos', u:'https://wallet.google.com/', i:'wallet', c:C.gray, cat:'Conta', k:'pay pagamento' },
  { id:'passwords', n:'Senhas', d:'Gerenciador', u:'https://passwords.google.com/', i:'gear', c:C.gray, cat:'Conta', k:'passwords' },
];

const QUICK = [
  { n:'Documento', u:'https://docs.new', c:C.docs, l:'D' },
  { n:'Planilha', u:'https://sheets.new', c:C.sheets, l:'P' },
  { n:'Apresentação', u:'https://slides.new', c:C.slides, l:'A' },
  { n:'Formulário', u:'https://forms.new', c:C.forms, l:'F' },
  { n:'Evento', u:'https://cal.new', c:C.blue, l:'+' },
  { n:'Reunião', u:'https://meet.new', c:C.teal, l:'▶' },
  { n:'Nota', u:'https://keep.new', c:C.yellow, l:'✎' },
  { n:'E-mail', u:'https://mail.google.com/mail/?view=cm', c:C.red, l:'@' },
];

/* ---------- State ---------- */
const store = {
  get() { try { return JSON.parse(localStorage.getItem('gh.favs')) ?? ['gmail','calendar','drive','docs','sheets','gemini']; } catch { return ['gmail','calendar','drive','docs','sheets']; } },
  set(v) { try { localStorage.setItem('gh.favs', JSON.stringify(v)); } catch {} }
};
let favs = store.get();

/* ---------- Render ---------- */
const STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 3.2 2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 17l-5.4 3 1.1-6.1-4.5-4.3 6.1-.8z"/></svg>';
const STAR_O = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3.2 2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 17l-5.4 3 1.1-6.1-4.5-4.3 6.1-.8z"/></svg>';

const card = (a, i) => {
  const on = favs.includes(a.id);
  return `<a class="app" href="${a.u}" target="_blank" rel="noopener" data-id="${a.id}" data-s="${(a.n+' '+a.d+' '+(a.k||'')).toLowerCase()}" style="--c:${a.c};--i:${i}">
    <span class="icon">${svg(a.i)}</span>
    <span><div class="name">${a.n}</div><div class="desc">${a.d}</div></span>
    <button class="pin ${on?'on':''}" data-pin="${a.id}" aria-label="${on?'Remover dos':'Adicionar aos'} favoritos" title="${on?'Remover dos favoritos':'Fixar nos favoritos'}">${on?STAR:STAR_O}</button>
  </a>`;
};

function render() {
  document.getElementById('quick').innerHTML = QUICK.map((q,i) =>
    `<a class="chip" href="${q.u}" target="_blank" rel="noopener" style="--i:${i}"><i style="background:${q.c}">${q.l}</i>${q.n}</a>`).join('');

  const favApps = favs.map(id => APPS.find(a => a.id === id)).filter(Boolean);
  document.getElementById('fav').innerHTML = favApps.map(card).join('');
  document.getElementById('favSec').classList.toggle('hidden', !favApps.length);

  const cats = [...new Set(APPS.map(a => a.cat))];
  document.getElementById('cats').innerHTML = cats.map(cat => {
    const list = APPS.filter(a => a.cat === cat);
    return `<section data-cat><h2>${cat} <small>${list.length}</small></h2><div class="grid">${list.map(card).join('')}</div></section>`;
  }).join('');
  filter();
}

/* ---------- Search ---------- */
const q = document.getElementById('q');
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
function filter() {
  const t = norm(q.value);
  const searching = !!t;
  document.getElementById('quickSec').classList.toggle('hidden', searching);
  document.getElementById('favSec').classList.toggle('hidden', searching || !favs.length);
  let any = 0;
  document.querySelectorAll('#cats section').forEach(sec => {
    let n = 0;
    sec.querySelectorAll('.app').forEach(el => {
      const hit = !t || norm(el.dataset.s).includes(t);
      el.classList.toggle('hidden', !hit); n += hit;
    });
    sec.classList.toggle('hidden', !n); any += n;
  });
  document.getElementById('empty').style.display = any ? 'none' : 'block';
}
q.addEventListener('input', filter);
q.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const first = document.querySelector('#cats .app:not(.hidden)');
    if (first) window.open(first.href, '_blank', 'noopener');
  }
  if (e.key === 'Escape') { q.value = ''; filter(); q.blur(); }
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); q.focus(); q.select(); }
  else if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
});

/* ---------- Pin ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-pin]');
  if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const id = b.dataset.pin;
  favs = favs.includes(id) ? favs.filter(x => x !== id) : [...favs, id];
  store.set(favs);
  render();
});

/* ---------- Greeting ---------- */
const h = new Date().getHours();
document.getElementById('greet').textContent = h < 5 ? 'Boa noite.' : h < 12 ? 'Bom dia.' : h < 18 ? 'Boa tarde.' : 'Boa noite.';
const ds = new Date().toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
document.getElementById('date').textContent = ds.charAt(0).toUpperCase() + ds.slice(1);

render();
</script>
</body>
</html>
