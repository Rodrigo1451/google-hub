<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Hub</title>
<meta name="color-scheme" content="light dark">
<script src="js/host.js"></script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip" href="#content" tabindex="0">Pular para os apps</a>
<div class="wallpaper" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<div class="shell">
  <nav class="sidebar" aria-label="Seções">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Google Hub</span></div>
    <ul id="nav" role="list"></ul>
    <div class="account" role="radiogroup" aria-labelledby="account-label" aria-describedby="account-hint">
      <span class="account-label" id="account-label">Conta Google</span>
      <div class="segmented" id="account-options"></div>
      <span class="account-hint" id="account-hint">Qual conta logada abre os apps</span>
    </div>
  </nav>

  <div class="stage">
    <header class="toolbar">
      <button id="open-palette" class="search-trigger" type="button" tabindex="0" aria-haspopup="dialog" aria-keyshortcuts="Meta+K /">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
        <span>Buscar apps</span>
        <kbd aria-hidden="true">⌘K</kbd>
      </button>
    </header>

    <main id="content" tabindex="-1">
      <div class="hero">
        <h1 id="greet">Olá.</h1>
        <p id="date"></p>
      </div>
      <div id="sections"></div>
      <footer class="foot">
        <p>Os apps abrem numa nova aba do Safari.</p>
        <p><kbd>⌘K</kbd> buscar · <kbd>←↑→↓</kbd> navegar · <kbd>F</kbd> favoritar · <kbd>⌥←</kbd><kbd>⌥→</kbd> reordenar favoritos</p>
      </footer>
    </main>
  </div>
</div>

<dialog id="palette" aria-label="Buscar apps">
  <div class="palette-field">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
    <input id="palette-input" type="text" role="combobox" aria-expanded="true" aria-controls="palette-list"
           aria-autocomplete="list" aria-label="Buscar apps" placeholder="Buscar apps" autocomplete="off" spellcheck="false">
    <kbd aria-hidden="true">esc</kbd>
  </div>
  <p class="palette-hint" id="palette-hint"></p>
  <ul id="palette-list" role="listbox" aria-label="Resultados"></ul>
</dialog>

<div id="live" class="sr-only" aria-live="polite"></div>

<script src="js/catalog.js"></script>
<script src="logos/manifest.js"></script>
<script src="js/search.js"></script>
<script src="js/favorites.js"></script>
<script src="js/accounts.js"></script>
<script src="js/ui.js"></script>
<script src="js/grid-nav.js"></script>
<script src="js/palette.js"></script>
</body>
</html>
